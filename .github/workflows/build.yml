name: Build Windows Installers

on:
  push:
    branches: [ProMax, Fix]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (MSI + EXE)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri (MSI + NSIS EXE)
        run: npm run tauri build

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Collect build artifacts
        shell: bash
        run: |
          mkdir -p release
          cp src-tauri/target/release/bundle/msi/*.msi release/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe release/ 2>/dev/null || true
          find src-tauri/target/release -maxdepth 1 -name "*.exe" ! -name "*uninst*" -exec cp {} release/ \; 2>/dev/null || true
          ls -la release/

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Ledger Pro Max ${{ steps.version.outputs.version }}
          body: |
            ## 👑 Ledger Pro Max ${{ steps.version.outputs.version }}

            ### 📦 安装包

            | 文件 | 类型 |
            |------|------|
            | `.msi` | WiX 安装程序（推荐） |
            | `.exe` | NSIS 安装向导 |
            | 便携版 `.exe` | 免安装直接运行 |

            ### 🔧 安装说明

            1. 下载 `.msi` 或 `.exe` 安装包
            2. 双击运行，按向导完成安装
            3. 首次启动会自动创建工作空间

            > 提交: ${{ github.sha }} · 分支: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ github.ref_name != 'ProMax' }}
          files: release/*
          make_latest: true
