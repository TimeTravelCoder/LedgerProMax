name: Build & Release (Signed)

# ============================================================
# 触发条件：
#   • 推送到 ProMax 或 Fix 分支时自动触发
#   • 或在 GitHub Actions 页面手动点击 Run workflow
# ============================================================
on:
  push:
    branches: [ProMax, Fix]
  workflow_dispatch:

jobs:
  build-windows:
    name: 🏗️ Windows Build (MSI + EXE + 签名 + Release)
    runs-on: windows-latest
    permissions:
      contents: write   # 需要写权限才能创建 Release

    steps:
      # ── 1. 检出代码 ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # ── 3. Rust ──────────────────────────────────────────────
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── 4. 编译 + 签名 ───────────────────────────────────────
      #  TAURI_SIGNING_PRIVATE_KEY 和 TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      #  必须在 GitHub → Settings → Secrets and variables → Actions 中添加
      - name: Build & Sign Tauri App
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── 5. 读取版本号 ────────────────────────────────────────
      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=v${VERSION}"     >> $GITHUB_OUTPUT
          echo "version=${VERSION}"  >> $GITHUB_OUTPUT

      # ── 6. 收集产物 ──────────────────────────────────────────
      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p release
          cp src-tauri/target/release/bundle/msi/*.msi      release/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi.sig  release/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe     release/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe.sig release/ 2>/dev/null || true
          echo "=== release/ ===" && ls -lh release/

      # ── 7. 生成 updater.json ─────────────────────────────────
      #  这是自动更新的核心文件，本地 app 启动时会从 Release latest
      #  拉取这个文件，判断是否有新版本并展示更新提示
      - name: Generate updater.json
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # 优先用 NSIS 包（体积更小，适合增量更新）
          NSIS_FILE=$(ls release/*-setup.exe 2>/dev/null | head -1)
          NSIS_NAME=$(basename "$NSIS_FILE")
          NSIS_SIG=""
          [ -f "release/${NSIS_NAME}.sig" ] && NSIS_SIG=$(cat "release/${NSIS_NAME}.sig")

          # fallback MSI
          MSI_FILE=$(ls release/*.msi 2>/dev/null | head -1)
          MSI_NAME=$(basename "$MSI_FILE")
          MSI_SIG=""
          [ -f "release/${MSI_NAME}.sig" ] && MSI_SIG=$(cat "release/${MSI_NAME}.sig")

          if [ -n "$NSIS_SIG" ]; then
            WIN_URL="${BASE}/${NSIS_NAME}"; WIN_SIG="${NSIS_SIG}"
          else
            WIN_URL="${BASE}/${MSI_NAME}"; WIN_SIG="${MSI_SIG}"
          fi

          python3 - <<PYEOF
          import json
          data = {
            "version": "${VERSION}",
            "notes": "Ledger Pro Max ${TAG} — 见 Release Notes",
            "pub_date": "${NOW}",
            "platforms": {
              "windows-x86_64": {
                "signature": """${WIN_SIG}""".strip(),
                "url": "${WIN_URL}"
              }
            }
          }
          with open("release/updater.json", "w", encoding="utf-8") as f:
            json.dump(data, f, ensure_ascii=False, indent=2)
          print("updater.json OK:", json.dumps(data, ensure_ascii=False, indent=2))
          PYEOF

      # ── 8. 创建 GitHub Release 并上传所有文件 ────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "👑 Ledger Pro Max ${{ steps.version.outputs.tag }}"
          body: |
            ## 👑 Ledger Pro Max ${{ steps.version.outputs.tag }}

            ### 📦 下载安装包

            | 文件 | 说明 |
            |------|------|
            | `*_x64-setup.exe` | **推荐** NSIS 安装向导（体积小） |
            | `*_x64_zh-CN.msi` | WiX MSI 安装程序 |

            ### 🔄 自动更新

            已安装旧版本？**无需手动下载** — 软件启动后 3 秒内自动检测并提示更新，一键完成升级。

            ### 🔧 全新安装步骤

            1. 下载 `*-setup.exe`
            2. 双击运行安装向导
            3. 启动软件，自动初始化工作区

            ---
            > 🔨 构建: ${{ github.sha }} · 分支: ${{ github.ref_name }} · 时间: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: ${{ github.ref_name != 'ProMax' }}
          make_latest: true
          files: |
            release/*.msi
            release/*.msi.sig
            release/*.exe
            release/*.exe.sig
            release/updater.json
