name: Build & Release (Tag Triggered)

# ============================================================
# Trigger: Only fires when a version tag is pushed
#   git tag v3.1.0
#   git push origin v3.1.0
# Normal branch pushes do NOT trigger a build.
# ============================================================
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    name: "Build & Release ${{ github.ref_name }}"
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build & Sign Tauri App
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}"         >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p release
          cp "src-tauri/target/release/bundle/msi/"*.msi      release/ 2>/dev/null || true
          cp "src-tauri/target/release/bundle/msi/"*.msi.sig  release/ 2>/dev/null || true
          cp "src-tauri/target/release/bundle/nsis/"*.exe     release/ 2>/dev/null || true
          cp "src-tauri/target/release/bundle/nsis/"*.exe.sig release/ 2>/dev/null || true
          echo "=== Artifacts ===" && ls -lh release/

      - name: Generate updater.json
        shell: bash
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          NSIS_FILE=$(ls release/*-setup.exe 2>/dev/null | head -1)
          NSIS_NAME=$(basename "$NSIS_FILE")
          NSIS_SIG=""
          [ -f "release/${NSIS_NAME}.sig" ] && NSIS_SIG=$(cat "release/${NSIS_NAME}.sig")

          MSI_FILE=$(ls release/*.msi 2>/dev/null | head -1)
          MSI_NAME=$(basename "$MSI_FILE")
          MSI_SIG=""
          [ -f "release/${MSI_NAME}.sig" ] && MSI_SIG=$(cat "release/${MSI_NAME}.sig")

          if [ -n "$NSIS_SIG" ]; then
            WIN_URL="${BASE}/${NSIS_NAME}"; WIN_SIG="${NSIS_SIG}"
          else
            WIN_URL="${BASE}/${MSI_NAME}"; WIN_SIG="${MSI_SIG}"
          fi

          python3 - <<PYEOF
          import json, os, sys
          win_url = "${WIN_URL}".replace(" ", ".")
          data = {
            "version": "${VERSION}",
            "notes": "Ledger Pro Max ${TAG}",
            "pub_date": "${NOW}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIG}".strip(),
                "url": win_url
              }
            }
          }
          with open("release/updater.json", "w", encoding="utf-8") as f:
            json.dump(data, f, ensure_ascii=False, indent=2)
          print(json.dumps(data, indent=2))
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Ledger Pro Max ${{ steps.version.outputs.tag }}"
          body: |
            ## Ledger Pro Max ${{ steps.version.outputs.tag }}

            ### Download

            | File | Description |
            |------|-------------|
            | `*_x64-setup.exe` | NSIS Installer (Recommended) |
            | `*_x64_zh-CN.msi` | WiX MSI Installer |

            ### Auto-Update

            Existing users: the app checks for updates on startup and will prompt automatically.

            ---
            > Commit: ${{ github.sha }} | Branch: ProMax
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release/*.msi
            release/*.msi.sig
            release/*.exe
            release/*.exe.sig
            release/updater.json
