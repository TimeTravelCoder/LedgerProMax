name: Build & Release (Signed)

on:
  push:
    branches: [ProMax, Fix]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (MSI + EXE, Signed)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri (MSI + NSIS EXE, Signed)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── Read version ────────────────────────────────────────────────
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "plain=$VERSION"    >> $GITHUB_OUTPUT

      # ── Collect installers + signatures ─────────────────────────────
      - name: Collect build artifacts
        shell: bash
        run: |
          mkdir -p release
          # MSI
          cp src-tauri/target/release/bundle/msi/*.msi       release/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi.sig   release/ 2>/dev/null || true
          # NSIS EXE
          cp src-tauri/target/release/bundle/nsis/*.exe      release/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe.sig  release/ 2>/dev/null || true
          # Portable EXE
          find src-tauri/target/release -maxdepth 1 -name "*.exe" ! -name "*uninst*" \
            -exec cp {} release/ \; 2>/dev/null || true
          ls -la release/

      # ── Generate updater.json ────────────────────────────────────────
      - name: Generate updater.json
        id: updater
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.plain }}
          TAG=${{ steps.version.outputs.version }}
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          # Collect signatures
          MSI_FILE=$(ls release/*.msi 2>/dev/null | head -1)
          MSI_SIG=""
          if [ -f "${MSI_FILE}.sig" ]; then
            MSI_SIG=$(cat "${MSI_FILE}.sig")
          fi

          NSIS_FILE=$(ls release/*.exe 2>/dev/null | grep -vi "portable\|uninst" | head -1)
          NSIS_SIG=""
          if [ -n "$NSIS_FILE" ] && [ -f "${NSIS_FILE}.sig" ]; then
            NSIS_SIG=$(cat "${NSIS_FILE}.sig")
          fi

          MSI_NAME=$(basename "$MSI_FILE")
          NSIS_NAME=$(basename "$NSIS_FILE")
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > release/updater.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Ledger Pro Max ${TAG} — 请查看 Release 说明获取更新详情。",
            "pub_date": "${NOW}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${MSI_SIG}",
                "url": "${BASE}/${MSI_NAME}"
              }
            }
          }
          EOF

          echo "updater.json generated:"
          cat release/updater.json

      # ── Create GitHub Release ────────────────────────────────────────
      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: 👑 Ledger Pro Max ${{ steps.version.outputs.version }}
          body: |
            ## 👑 Ledger Pro Max ${{ steps.version.outputs.version }}

            ### 📦 安装包

            | 文件 | 类型 |
            |------|------|
            | `.msi` | WiX 安装程序（推荐，支持自动更新） |
            | `.exe` | NSIS 安装向导 |
            | 便携版 `.exe` | 免安装直接运行 |

            ### 🔧 安装说明

            1. 下载 `.msi` 安装包
            2. 双击运行，按向导完成安装
            3. 软件启动后将自动检测新版本，可一键更新

            ### 🔄 自动更新

            已安装的旧版本启动后 3 秒内会自动检查此 Release，
            如检测到新版本将弹出更新提示，点击确认即可完成静默升级。

            ---
            > 提交: ${{ github.sha }} · 分支: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ github.ref_name != 'ProMax' }}
          files: |
            release/*.msi
            release/*.msi.sig
            release/*.exe
            release/*.exe.sig
            release/updater.json
          make_latest: true
