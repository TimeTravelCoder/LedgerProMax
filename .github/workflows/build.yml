name: Build & Release

# Normal pushes run ci.yml; this workflow publishes version tags.
# Manual reruns must select an existing version tag, not a branch.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build & Release ${{ github.ref_name }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require a version tag
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'Select an existing vX.Y.Z tag for a manual release.' >&2
            exit 1
          }

      - name: Reject an already published release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            core.setFailed(`Release ${tag} already exists; do not replace published artifacts.`);

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release version and frontend
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm run version:check -- --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:workflow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Validate Rust
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and sign Tauri app
        run: npm run tauri -- build --bundles nsis,msi -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Prepare and validate release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: npm run release:prepare -- "$env:RELEASE_TAG" "$env:RELEASE_REPOSITORY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Ledger Pro Max ${{ github.ref_name }}
          body: |
            Windows installers: NSIS (*-setup.exe) and MSI (*.msi).
            Updater signatures and SHA256SUMS are included.
            Commit: ${{ github.sha }}
          draft: true
          prerelease: false
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.msi
            release/*.msi.sig
            release/*.exe
            release/*.exe.sig
            release/updater.json
            release/SHA256SUMS

      - name: Verify uploaded artifacts before publishing
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.RELEASE_TAG });
            if (!release.draft) throw new Error('Expected an unpublished release draft');
            const { data: assets } = await github.rest.repos.listReleaseAssets({ ...context.repo, release_id: release.id, per_page: 100 });
            const expected = fs.readdirSync('release').sort();
            const actual = assets.map(asset => asset.name).sort();
            if (JSON.stringify(expected) !== JSON.stringify(actual)) throw new Error('Uploaded asset filenames differ from generated metadata');
            for (const asset of assets) {
              const response = await github.rest.repos.getReleaseAsset({ ...context.repo, asset_id: asset.id, headers: { accept: 'application/octet-stream' } });
              const downloaded = Buffer.from(response.data);
              const local = fs.readFileSync(path.join('release', asset.name));
              const hash = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
              if (hash(downloaded) !== hash(local)) throw new Error('Uploaded bytes differ: ' + asset.name);
            }
            const updater = JSON.parse(fs.readFileSync('release/updater.json', 'utf8'));
            const installerName = decodeURIComponent(new URL(updater.platforms['windows-x86_64'].url).pathname.split('/').pop());
            if (!assets.some(asset => asset.name === installerName)) throw new Error('Updater points to a missing release asset');
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false, prerelease: false, make_latest: 'true' });
