name: Windows Preview Build

on:
  push:
    branches: ['codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: 编译 Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装前端依赖
        run: npm ci
      - name: 检查版本、测试与代码规范
        run: |
          npm run version:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:workflow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: 检查并测试后端
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 编译并签名安装包
        run: npm run tauri -- build --bundles nsis,msi -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: 收集安装包与校验文件
        run: |
          $outputDir = New-Item -ItemType Directory -Path preview-artifacts -Force
          foreach ($pattern in @('src-tauri/target/release/bundle/nsis/*.exe', 'src-tauri/target/release/bundle/nsis/*.exe.sig', 'src-tauri/target/release/bundle/msi/*.msi', 'src-tauri/target/release/bundle/msi/*.msi.sig')) {
            $files = @(Get-ChildItem -Path $pattern -File -ErrorAction Stop)
            if ($files.Count -ne 1) { throw "Expected one artifact for $pattern" }
            Copy-Item -LiteralPath $files[0].FullName -Destination $outputDir.FullName
          }
          Get-ChildItem preview-artifacts -File | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 preview-artifacts/SHA256SUMS
          "Commit: $env:GITHUB_SHA" | Set-Content -Encoding utf8 preview-artifacts/BUILD.txt
      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: LedgerProMax-Windows-${{ github.sha }}
          path: preview-artifacts/*
          if-no-files-found: error
          retention-days: 14
